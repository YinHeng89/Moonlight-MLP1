# Moonlight pak user settings. Edit this file on the SD card; it is sourced by
# launch.sh, so plain shell variable assignments are what it wants.
#
# HOST     the PC to connect to. Leave it empty to have moonlight find the
#          first host that answers on the network via mDNS.
# APP      the name of the application to stream, exactly as it is listed on
#          the host (run MODE=list once to see the names).
# MODE     what to do when the pak is opened: stream, pair, list or quit.
#          stream is the normal one; pair shows the PIN on screen and waits for
#          it to be typed into the host; list shows nothing on the device, it
#          writes the host's app list to the log.
# WIDTH / HEIGHT / FPS / BITRATE   the stream itself. 1280x720 at 60 is a safe
#          starting point for the MLP1's software decoder.
# CODEC    h264 or hevc. h264 unless the host is known to negotiate HEVC well.
# EXTRA    extra moonlight arguments, word-split by the shell. Empty is fine.

HOST=""
APP="Steam"
MODE="stream"

WIDTH="1280"
HEIGHT="720"
FPS="60"
BITRATE="10000"
CODEC="h264"
EXTRA=""
