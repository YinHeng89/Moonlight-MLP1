# Moonlight pak user settings. Edit this file on the SD card; it is sourced by
# launch.sh, so plain shell variable assignments are what it wants.
#
# HOST     the PC to connect to. Leave it empty to have moonlight find the
#          first host that answers on the network via mDNS.
# APP      the name of the application to stream, exactly as it is listed on
#          the host (run MODE=list once to see the names).
# MODE     what to do when the pak is opened: menu, stream, pair, list, diag,
#          probe or quit.
#          menu opens the pak's own settings screen, where every value in this
#          file can be changed with the d-pad and a START button runs whatever
#          Action is set to. It rewrites this file for you, keeping the values
#          and dropping comments -- so the comments above are worth reading
#          before the first run, not after it.
#          stream is the normal one; pair shows the PIN on screen and waits for
#          it to be typed into the host; list shows nothing on the device, it
#          writes the host's app list to the log; diag does not stream at all,
#          it tests whether this device can reach HOST (ping, ports 47989 and
#          47984, one real request from moonlight) and puts the result on
#          screen. Use diag when the screen stays black or nothing connects;
#          probe does not stream either, it reports what each physical button
#          is called, which is what QUIT_COMBO below is made of.
# WIDTH / HEIGHT / FPS / BITRATE   the stream itself. See the notes below --
#          the defaults here are chosen for the MLP1's panel and its software
#          decoder, and the old 1280x720@60/10000 is what made it stutter.
# CODEC    h264 or hevc. h264 unless the host is known to negotiate HEVC well.
# PACKETSIZE  max video packet in bytes; empty for moonlight's own default.
# QUIT_COMBO  up to four names, comma separated, that end the stream when held
#          together. A name is matched against SDL key names *and* gamepad
#          button names, so both work: "back,start" (the default, this
#          device's two centre buttons), "guide", "x,b", or "escape" on a
#          keyboard. Empty means no way out of a stream except the power
#          button: moonlight's own quit is Ctrl+Alt+Shift+Q, which this device
#          has no keys to press. Run MODE=probe to see what your buttons are
#          called; the names come out in moonlight-probe.txt.
# PAD_LAYOUT  nintendo or xbox. The MLP1's four face buttons are arranged like
#          a Nintendo pad's (A right, B bottom, X top, Y left), but everything
#          you stream is a PC game, and a PC game draws its prompts for an Xbox
#          pad -- confirm at the bottom, cancel on the right.
#            xbox     = the position wins (the default). The bottom button,
#                       printed B, is what a game calls A and confirms with;
#                       the right one, printed A, cancels. X and Y swap too.
#            nintendo = the letter printed on the button wins. Only right if
#                       the host flips it back -- Steam's "Use Nintendo Button
#                       Layout" -- so pick one, not both: they cancel out.
#          Leave it on xbox unless a game reads the letters instead; for those,
#          pick custom and point the buttons one at a time.
# EXTRA    extra moonlight arguments, word-split by the shell. Empty is fine.

HOST="192.168.100.126"
APP="Steam"
MODE="menu"

# The MLP1's panel is 960x720 and 4:3. Ask for exactly that and nothing has to
# be scaled on the way to the screen. Ask for 1280x720 and you pay for a
# quarter more pixels -- the decoder's, the network's -- only to have them
# squeezed sideways into a 4:3 panel.
WIDTH="960"
HEIGHT="720"

# There is no hardware decoder in this build: ffmpeg does it on the CPU, and
# four Cortex-A55 cores keep up with 720p at 30, not at 60.
FPS="30"

# Kbps. 2.4GHz, start here. Still not smooth -> 3000. On 5GHz -> 10000 is fine.
BITRATE="5000"
CODEC="h264"

# Under the 1500-byte ethernet MTU on purpose. Bigger video packets get split
# into fragments, and on a lossy link losing one fragment costs the whole
# frame -- which is what stutter looks like from the couch.
PACKETSIZE="1024"

# The probe found these: the MLP1 is a real game controller to SDL ("Loong
# Gamepad"), and back, start, guide, both shoulders and the d-pad all exist.
# back+start is the natural two-button hold; if a game uses it, try "guide"
# on its own, or "leftshoulder,rightshoulder,start".
QUIT_COMBO="back,start"

# See the note above. xbox = positions, which is what a PC game expects: the
# button printed B (bottom) is the one a game confirms with.
PAD_LAYOUT="xbox"

# Set PAD_LAYOUT="custom" and fill this in to point each printed button at any
# button the host knows -- a=x,b=a,x=x,y=y leaves three of them alone. This is
# the one setting that cannot be guessed: games disagree with each other about
# whether they read the letter on the button or the position it sits in. The
# settings screen writes it when you point a button by hand.
PAD_MAP=""

# The MLP1's pad is not in SDL's database, so SDL numbers its buttons the way
# Linux does -- by position, which puts A where B is printed. Both this pak and
# the settings screen correct for that, so every name above means the letter
# printed on the button. Leave this empty and it stays automatic; set it to
# "labels" only if a pad ever turns out to be numbered the way it is printed.
PAD_WIRING=""

# The host has to be told to change its own display to this too, or a 16:9
# desktop gets squeezed into a 4:3 frame and you get black bars or a stretched
# picture. See the README: on Windows Sunshine does it by itself, on macOS it
# needs a prep command with displayplacer.
EXTRA=""
