name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Re-running a release should not require pushing a tag from a shell. A tag
  # push is still the normal path; this one exists for recovering from a tag
  # that landed on the wrong commit, which is how it went the first time.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish as a release under this tag (e.g. v1.0.1). Leave empty to only build."
        required: false
        default: ""

jobs:
  moonlight:
    # Publishing a release needs more than the default read-only token. Repos
    # created since 2023 hand workflows a read-only GITHUB_TOKEN unless told
    # otherwise, and the failure mode is unhelpful: the build goes green and
    # the release step 403s without ever explaining itself.
    permissions:
      contents: write

    # The toolchain image is arm64-only and its container runs target binaries
    # natively, so build on a native aarch64 runner. Emulating it under QEMU on
    # x86_64 works but turns the ffmpeg cross-build from minutes into hours.
    #
    # Native arm64 runners are free for public repositories. On a private one,
    # either make it public or fall back to:
    #   runs-on: ubuntu-latest
    #   - uses: docker/setup-qemu-action@v3
    #     with: { platforms: arm64 }
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Start the pinned toolchain container
        run: |
          set -euo pipefail
          # Pinned by digest in scripts/upstream.lock.json; read it rather than
          # repeating the string, so the two cannot drift apart.
          DIGEST="$(sed -n 's/.*"digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' scripts/upstream.lock.json | head -1)"
          IMAGE_REPO="ghcr.io/utility-muffin-research-kitchen/mlp1-toolchain"
          echo "image: $IMAGE_REPO@$DIGEST"
          docker run -d --name mlp1-build \
            -v "$PWD:/host" \
            --entrypoint sleep "$IMAGE_REPO@$DIGEST" infinity
          docker ps --format '{{.Names}} {{.Status}}'

      - name: Cross-build the libraries the sysroot lacks
        run: docker exec mlp1-build bash /host/scripts/build-deps.sh

      - name: Build and verify moonlight
        run: docker exec mlp1-build bash /host/scripts/build-moonlight.sh

      - name: Assemble the pak
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zip
          # Same inputs give the same bytes, so the zip is stable across runs.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./scripts/package-pak.sh
          mkdir -p build/dist
          (cd build/package && zip -qr ../dist/Moonlight.mlp1.pak.zip Moonlight.pak)

      - name: Record the verification report
        run: |
          cp build/mlp1/verify-binary.txt build/dist/verify-binary.txt
          cat build/dist/verify-binary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight.mlp1.pak
          path: |
            build/dist/Moonlight.mlp1.pak.zip
            build/dist/verify-binary.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # A manual dispatch has no tag ref; the input names the tag to create
          # at this commit. Empty on a tag push, where the ref already says it.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: build/dist/Moonlight.mlp1.pak.zip
          # What changed lives beside the release it describes rather than in
          # this file, so editing the notes is a commit and not a workflow
          # change -- and a re-run of an older tag still finds the notes that
          # were current when that tag was cut.
          body_path: RELEASE_NOTES.md
